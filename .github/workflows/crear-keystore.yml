name: Crear keystore (ejecutar una sola vez por aplicación)

on:
  workflow_dispatch:
    inputs:
      alias:
        description: "Alias de la clave (letras, números, guion). Vacío = nombre del repositorio"
        required: false
        default: ""
        type: string
      reemplazar:
        description: "DEJAR VACÍO. Solo si ya hay Secrets y quieres otra identidad de firma: escribe REEMPLAZAR"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXISTING_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
      INPUT_ALIAS: ${{ inputs.alias }}
      INPUT_REEMPLAZAR: ${{ inputs.reemplazar }}
      REPO_NAME: ${{ github.event.repository.name }}
    steps:
      - name: Comprobar que no existe ya una identidad de firma
        run: |
          if [ -n "$EXISTING_KEYSTORE" ] && [ "$INPUT_REEMPLAZAR" != "REEMPLAZAR" ]; then
            echo "::error::Este repositorio ya tiene KEYSTORE_BASE64 configurado. No se genera otro keystore: cambiar la firma impediría actualizar la app ya instalada."
            exit 1
          fi

      - name: Generar keystore y credenciales
        id: gen
        run: |
          set -euo pipefail
          umask 077
          ALIAS="$INPUT_ALIAS"
          if [ -z "$ALIAS" ]; then
            ALIAS="$(printf '%s' "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed 's/^-*//;s/-*$//')"
          fi
          if ! printf '%s' "$ALIAS" | grep -Eq '^[A-Za-z0-9_-]{1,40}$'; then
            echo "::error::Alias no válido. Usa solo letras, números, guion y guion bajo (máx. 40)."
            exit 1
          fi
          STORE_PASSWORD="$(python3 -c "import secrets,string;print(''.join(secrets.choice(string.ascii_letters+string.digits) for _ in range(28)))")"
          echo "::add-mask::$STORE_PASSWORD"
          export STORE_PASSWORD
          mkdir -p "$RUNNER_TEMP/ks"
          KS="$RUNNER_TEMP/ks/release.p12"
          keytool -genkeypair -keystore "$KS" -storetype PKCS12 \
            -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 10950 \
            -storepass:env STORE_PASSWORD -keypass:env STORE_PASSWORD \
            -dname "CN=${REPO_NAME}, O=${REPO_NAME}"
          B64="$(base64 -w0 "$KS")"
          echo "::add-mask::$B64"
          mkdir -p "$RUNNER_TEMP/out"
          {
            echo "KEYSTORE_BASE64=$B64"
            echo "KEY_ALIAS=$ALIAS"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_PASSWORD=$STORE_PASSWORD"
          } > "$RUNNER_TEMP/out/secrets.txt"
          cp "$KS" "$RUNNER_TEMP/out/release.p12"
          FP="$(keytool -list -v -keystore "$KS" -alias "$ALIAS" -storepass:env STORE_PASSWORD | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')"
          {
            echo "### Keystore generado"
            echo ""
            echo "Huella SHA-256 (pública): \`$FP\`"
            echo ""
            echo "1. Descarga el artefacto **keystore-secretos** (abajo del todo de esta página)."
            echo "2. Abre \`secrets.txt\` y copia sus 4 valores en *Settings → Secrets and variables → Actions → New repository secret*."
            echo "3. Guarda también \`release.p12\` en un lugar seguro: es tu copia de respaldo. Los Secrets no se pueden volver a leer."
            echo "4. El artefacto caduca en 3 días. Después no se puede regenerar sin cambiar la identidad de firma."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar los valores como artefacto privado (caduca en 3 días)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-secretos
          path: ${{ runner.temp }}/out/
          retention-days: 3
          if-no-files-found: error

      - name: Borrar copias temporales
        if: always()
        run: rm -rf "$RUNNER_TEMP/ks" "$RUNNER_TEMP/out"
