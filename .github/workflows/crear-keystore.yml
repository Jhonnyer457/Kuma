name: Crear keystore (ejecutar UNA sola vez por app)

on:
  workflow_dispatch:
    inputs:
      alias:
        description: "Alias de la clave (sin espacios)"
        required: true
        default: "release"
      nombre:
        description: "Nombre de la app (CN del certificado)"
        required: true
        default: "MiApp"

permissions:
  contents: read

jobs:
  crear:
    runs-on: ubuntu-latest
    env:
      SECRETO_EXISTENTE: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Detener si ya existe una identidad de firma
        run: |
          if [ -n "$SECRETO_EXISTENTE" ]; then
            echo "::error::KEYSTORE_BASE64 ya esta configurado en este repositorio. No se genera otro keystore para no romper las actualizaciones. Si de verdad quieres empezar de cero, borra los 4 Secrets y vuelve a ejecutar."
            exit 1
          fi

      - name: Validar entradas
        env:
          ALIAS: ${{ inputs.alias }}
          NOMBRE: ${{ inputs.nombre }}
        run: |
          [[ "$ALIAS" =~ ^[A-Za-z0-9_-]{1,40}$ ]] || { echo "::error::Alias invalido (usa letras, numeros, - o _)"; exit 1; }
          [[ "$NOMBRE" =~ ^[A-Za-z0-9\ _-]{1,40}$ ]] || { echo "::error::Nombre invalido (usa letras, numeros, espacios, - o _)"; exit 1; }

      - name: Generar keystore y volcar valores al resumen
        env:
          ALIAS: ${{ inputs.alias }}
          NOMBRE: ${{ inputs.nombre }}
        run: |
          set -euo pipefail
          umask 077
          PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$PASS"
          KS="$RUNNER_TEMP/app.keystore"
          keytool -genkeypair -storetype PKCS12 -keystore "$KS" \
            -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=$NOMBRE, O=Personal, C=XX" >/dev/null 2>&1
          B64="$(base64 -w0 "$KS")"
          echo "::add-mask::$B64"
          SHA="$(keytool -list -v -keystore "$KS" -storepass "$PASS" -alias "$ALIAS" 2>/dev/null | grep 'SHA256:' | head -1 | sed 's/^ *//')"
          {
            echo "# Valores para GitHub Secrets"
            echo
            echo "Repositorio > Settings > Secrets and variables > Actions > New repository secret."
            echo "Crea 4 secrets con **exactamente** estos nombres y copia cada valor completo."
            echo
            echo "### KEYSTORE_BASE64"
            echo '```'
            echo "$B64"
            echo '```'
            echo "### KEY_ALIAS"
            echo '```'
            echo "$ALIAS"
            echo '```'
            echo "### STORE_PASSWORD"
            echo '```'
            echo "$PASS"
            echo '```'
            echo "### KEY_PASSWORD"
            echo '```'
            echo "$PASS"
            echo '```'
            echo
            echo "Huella publica del certificado (no es secreta): \`$SHA\`"
            echo
            echo "**Despues de guardar los 4 secrets:** guarda una copia en un gestor de contraseñas y BORRA esta ejecucion (Actions > esta ejecucion > menu ⋯ > Delete workflow run). Si pierdes estas claves no podras actualizar la app instalada."
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$KS"
          echo "Listo. Los valores estan en el RESUMEN de esta ejecucion (pestaña Summary), no en los logs."
