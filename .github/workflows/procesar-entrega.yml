name: Procesar entrega, compilar y publicar

on:
  push:
    branches: [main, master]
    paths:
      - "deliveries/inbox/*.zip"
  workflow_dispatch:

# Una sola entrega a la vez, en orden, sin cancelar la que esta en curso
concurrency:
  group: procesar-entrega
  cancel-in-progress: false

permissions:
  contents: write

env:
  CI: "true"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  detectar:
    runs-on: ubuntu-latest
    outputs:
      hay: ${{ steps.d.outputs.hay }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: d
        name: Buscar entrega en deliveries/inbox/
        run: |
          shopt -s nullglob
          zips=(deliveries/inbox/*.zip)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "No hay ZIP en la bandeja de entrada: nada que procesar."
            echo "hay=false" >> "$GITHUB_OUTPUT"
          else
            echo "hay=true" >> "$GITHUB_OUTPUT"
          fi

  entrega:
    needs: detectar
    if: needs.detectar.outputs.hay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Comprobar credenciales de firma
        env:
          K1: ${{ secrets.KEYSTORE_BASE64 }}
          K2: ${{ secrets.KEY_ALIAS }}
          K3: ${{ secrets.STORE_PASSWORD }}
          K4: ${{ secrets.KEY_PASSWORD }}
        run: |
          faltan=""
          [ -n "$K1" ] || faltan="$faltan KEYSTORE_BASE64"
          [ -n "$K2" ] || faltan="$faltan KEY_ALIAS"
          [ -n "$K3" ] || faltan="$faltan STORE_PASSWORD"
          [ -n "$K4" ] || faltan="$faltan KEY_PASSWORD"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan GitHub Secrets:$faltan. Ejecuta crear-keystore.yml una vez y guarda los 4 valores en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Validar e integrar la entrega ZIP
        id: entrega
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(deliveries/inbox/*.zip)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::No hay ningun .zip en deliveries/inbox/"; exit 1
          fi
          if [ "${#zips[@]}" -gt 1 ]; then
            echo "::error::Hay ${#zips[@]} ZIP en deliveries/inbox/. Sube y procesa una entrega a la vez."; exit 1
          fi
          python3 ci/apply_delivery.py "${zips[0]}"

      - name: Configurar JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Descodificar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/app.keystore"
          echo "CI_KEYSTORE_PATH=$RUNNER_TEMP/app.keystore" >> "$GITHUB_ENV"

      - name: Compilar y firmar con Gradle
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_TASK: ${{ steps.entrega.outputs.gradle_task }}
          APP_VERSION: ${{ steps.entrega.outputs.version }}
          APP_CODE: ${{ steps.entrega.outputs.version_code }}
        run: |
          chmod +x ./gradlew
          ./gradlew "$APP_TASK" --stacktrace \
            -PappVersionName="$APP_VERSION" -PappVersionCode="$APP_CODE"

      - name: Reunir y verificar APKs firmadas
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          APK_DIR: ${{ steps.entrega.outputs.apk_dir }}
          TAG: ${{ steps.entrega.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -name '*.apk' ! -name '*unsigned*' | sort)
          [ "${#APKS[@]}" -gt 0 ] || { echo "::error::Gradle no genero ninguna APK en $APK_DIR"; exit 1; }
          APKSIGNER="$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          ESPERADA="$(keytool -list -v -keystore "$CI_KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//; s/://g' | tr 'A-F' 'a-f')"
          [ -n "$ESPERADA" ] || { echo "::error::No se pudo leer la huella del keystore (alias o contraseña incorrectos)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/dist"
          for f in "${APKS[@]}"; do
            "$APKSIGNER" verify "$f" >/dev/null
            REAL="$("$APKSIGNER" verify --print-certs "$f" | grep 'certificate SHA-256 digest' | head -1 | sed 's/.*: *//' | tr 'A-F' 'a-f')"
            if [ "$REAL" != "$ESPERADA" ]; then
              echo "::error::La firma de $(basename "$f") NO coincide con tu keystore. No se publica."; exit 1
            fi
            cp "$f" "$RUNNER_TEMP/dist/${TAG}-$(basename "$f")"
          done
          (cd "$RUNNER_TEMP/dist" && sha256sum ./*.apk > SHA256SUMS.txt)
          echo "Firma verificada en ${#APKS[@]} APK(s)."

      - name: Guardar APKs como artefacto de respaldo
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apks-${{ steps.entrega.outputs.tag }}
          path: ${{ runner.temp }}/dist/
          retention-days: 14

      - name: Guardar cambios integrados en la rama
        env:
          TITULO: ${{ steps.entrega.outputs.titulo }}
          TAG: ${{ steps.entrega.outputs.tag }}
        run: |
          set -euo pipefail
          rm -f "$CI_KEYSTORE_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Entrega ${TAG}: ${TITULO}"
          ok=0
          for i in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then ok=1; break; fi
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
          done
          [ "$ok" = 1 ] || { echo "::error::No se pudo hacer push a la rama"; exit 1; }
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Crear GitHub Release con las APK firmadas
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.entrega.outputs.tag }}
          NOMBRE: ${{ steps.entrega.outputs.release_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::La Release $TAG ya existe; no se sobrescribe."; exit 1
          fi
          gh release create "$TAG" "$RUNNER_TEMP"/dist/*.apk "$RUNNER_TEMP/dist/SHA256SUMS.txt" \
            --target "$COMMIT_SHA" --title "$NOMBRE" --notes-file "$RUNNER_TEMP/release_notes.md"
